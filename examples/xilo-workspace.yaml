# yaml-language-server: $schema=https://raw.githubusercontent.com/F1bonacc1/process-compose/main/schemas/process-compose-schema.json
#
# Catalog of every command in ~/.workspace-process-manager/config.json.
# Nothing long-running starts until you pick it.
#
# Usage:
#   pcx -f examples/xilo-workspace.yaml              # TUI
#   pcx -f examples/xilo-workspace.yaml up identity-start dashboard-start
#   pcx -f examples/xilo-workspace.yaml status
#
# Working dirs (env overrides the vars defaults):
#   WORKING_DIR=. XILO_API=../xilo-api pcx up
#   WORKING_DIR=/path/to/xilo-workspace XILO_API=/path/to/xilo-api pcx up

version: "0.5"
name: xilo-workspace

vars:
  WORKING_DIR: "."
  XILO_API: "../xilo-api"
  PORT: "3000"

processes:
  # ---------------------------------------------------------------------------
  # xilo-workspace — long-running start targets
  # ---------------------------------------------------------------------------
  xai-web-start:
    command: "npx nx run xai:start-web"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "xai:start-web"
    namespace: xilo-workspace
    disabled: true

  xai-worker-start:
    command: "npx nx run xai:start-worker"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "xai:start-worker"
    namespace: xilo-workspace
    disabled: true

  events-start:
    command: "npx nx run events:start"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "events:start"
    namespace: xilo-workspace
    disabled: true

  identity-start:
    command: "npx nx run identity:start"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "identity:start"
    namespace: xilo-workspace
    disabled: true

  pages-start:
    command: "npx nx run pages:start"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "pages:start"
    namespace: xilo-workspace
    disabled: true

  dashboard-start:
    command: "npx nx start dashboard --watch=false"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx start dashboard --watch=false"
    namespace: xilo-workspace
    disabled: true

  intake-start:
    command: "npx nx start intake-form --watch=false"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx start intake-form --watch=false"
    namespace: xilo-workspace
    disabled: true

  ui-pages-start:
    command: "npx nx run ui-pages:serve --watch=false"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run ui-pages:serve --watch=false"
    namespace: xilo-workspace
    disabled: true

  workflow-web-start:
    command: "npx nx run workflow:start-web"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run workflow:start-web"
    namespace: xilo-workspace
    disabled: true

  workflow-worker-start:
    command: "npx nx run workflow:start-worker"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run workflow:start-worker"
    namespace: xilo-workspace
    disabled: true

  customer-formly-start:
    command: "nx run customer-formly:serve --watch=false"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "nx run customer-formly:serve --watch=false"
    namespace: xilo-workspace
    disabled: true

  ui-client-start:
    command: "npx nx run client-portal:serve --watch=false"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run client-portal:serve --watch=false"
    namespace: xilo-workspace
    disabled: true

  auth-app-start:
    command: "npx nx run auth-app:start"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run auth-app:start"
    namespace: xilo-workspace
    disabled: true

  ai-agent-start-web:
    command: "npx nx run ai-agent:start-web"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run ai-agent:start-web"
    namespace: xilo-workspace
    disabled: true

  ai-agent-start-worker:
    command: "npx nx run ai-agent:start-worker"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "npx nx run ai-agent:start-worker"
    namespace: xilo-workspace
    disabled: true

  # ---------------------------------------------------------------------------
  # xilo-api
  # ---------------------------------------------------------------------------
  legacy-api-start:
    command: "npm start"
    working_dir: '{{or "${XILO_API}" .XILO_API}}'
    description: "npm start"
    namespace: xilo-api
    disabled: true

  legacy-start-worker:
    command: "npm run start:worker"
    working_dir: '{{or "${XILO_API}" .XILO_API}}'
    description: "npm run start:worker"
    namespace: xilo-api
    disabled: true

  xilo-api-run-migrations:
    command: "npx sequelize db:migrate"
    working_dir: '{{or "${XILO_API}" .XILO_API}}'
    description: "npx sequelize db:migrate"
    namespace: xilo-api
    disabled: true
    availability:
      restart: "no"

  xilo-api-pull-latest:
    command: "git pull origin develop"
    working_dir: '{{or "${XILO_API}" .XILO_API}}'
    description: "git pull origin develop"
    namespace: xilo-api
    disabled: true
    availability:
      restart: "no"

  # ---------------------------------------------------------------------------
  # xilo-workspace-SCRIPTS — infra one-shots
  # ---------------------------------------------------------------------------
  xilo-containers-start:
    command: "docker-compose -f docker-compose.local.yml up -d kafka redis postgres"
    working_dir: '{{or "${WORKING_DIR}" .WORKING_DIR}}'
    description: "docker-compose -f docker-compose.local.yml up -d kafka redis postgres"
    namespace: xilo-workspace-SCRIPTS
    disabled: true
    availability:
      restart: "no"
